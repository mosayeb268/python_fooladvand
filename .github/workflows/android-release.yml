name: Build and Publish Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'android-build'
  cancel-in-progress: true

jobs:
  build-and-release-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: website/package.json

      - name: Install Web Dependencies
        working-directory: website
        run: npm install

      - name: Build Web Application
        working-directory: website
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: website
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK Licenses and Platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x website/android/gradlew

      - name: Build Android Debug APK
        working-directory: website/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../../build.log || {
            python3 -c "
with open('../../build.log', 'r', errors='ignore') as f:
    text = f.read()
idx = text.find('FAILURE:')
if idx == -1:
    idx = text.find('* What went wrong:')
if idx != -1:
    relevant = text[idx:idx+2500]
    for line in relevant.split('\n')[:30]:
        if line.strip():
            print(f'::error title=Gradle::{line.strip()}')
else:
    for line in text.split('\n')[-30:]:
        if line.strip():
            print(f'::error title=Gradle::{line.strip()}')
"
            exit 1
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: build.log

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          APK_FILE=$(find website/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in output directory!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" release-apk/PDA-Python-Course-v1.0.0-Pad6Pro.apk
          ls -la release-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDA-Python-Android-Pad6Pro-APK
          path: release-apk/PDA-Python-Course-v1.0.0-Pad6Pro.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-android
          name: "📱 نسخه اندروید دوره پایتون و تحلیل داده (PDA) - ویژه تبلت شیائومی Pad 6 Pro"
          draft: false
          prerelease: false
          files: release-apk/PDA-Python-Course-v1.0.0-Pad6Pro.apk
          body: |
            ## 🚀 نسخه رسمی اندروید (APK) پرتال تحلیل داده با پایتون (PDA)

            این بسته نرم‌افزاری اختصاصاً برای تبلت **Xiaomi Pad 6 Pro** و تمامی دستگاه‌های اندرویدی تولید شده است.

            ### ✨ ویژگی‌های نسخه اندروید:
            - 🐍 **موتور مفسر زنده پایتون (Pyodide WebAssembly):** اجرای کامل و محلی کدهای علم داده با پکیج‌های NumPy، Pandas و Matplotlib
            - 💻 **استودیو و ترمینال تعاملی:** پشتیبانی کامل از ورودی درجا (`input()`) مستقیم داخل جریان ترمینال
            - 🌙 **تم دارک حرفه‌ای (Dark Mode):** طراحی اختصاصی و چشمنواز سازگار با نمایشگر 2.8K شیائومی
            - 📐 **چیدمان تبلت (Split View):** سازگار با نسبت تصویر ۱۶:۱۰، قلم و کیبورد فیزیکی
            - 📦 **دیتاست‌های محلی:** شامل دیتاست‌های Titanic و Employees
            - ⚡ **آفلاین کامل:** کارکرد بدون وابستگی به اینترنت پس از اولین اجرا

            ### 📲 راهنمای دانلود و نصب روی تبلت شیائومی Pad 6 Pro:
            1. فایل `PDA-Python-Course-v1.0.0-Pad6Pro.apk` پیوست شده در این صفحه را دانلود کنید.
            2. روی فایل دانلودی بزنید و در صورت نمایش پیام امنیتی، گزینه **Allow from this source (اجازه نصب از این منبع)** را فعال کنید.
            3. برنامه را اجرا کنید و از محیط تعاملی و پرسرعت کدنویسی لذت ببرید!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
